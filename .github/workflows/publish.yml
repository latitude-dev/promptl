name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get package version
        id: get_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version on npm
        id: check_version
        run: |
          NPM_VERSION=$(npm view promptl-ai version 2>/dev/null || echo "0.0.0")
          if [ "${{ steps.get_version.outputs.version }}" != "$NPM_VERSION" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build package (with workspace dependencies)
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm run build

      - name: Run linter
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm run lint

      - name: Run typescript checker
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm run tc

      - name: Run tests
        if: steps.check_version.outputs.should_publish == 'true'
        run: pnpm run test

      # Published with the npm CLI (not pnpm 9, which has no native OIDC support) so npm's
      # trusted publishing exchanges the GitHub OIDC token for a short-lived publish token.
      - name: Publish to npm (trusted publishing)
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
